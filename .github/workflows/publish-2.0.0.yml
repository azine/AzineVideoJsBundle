name: Publish Video.js Bundle 2.0.0

on:
  push:
    branches: [release/publish-2.0.0]
    paths: ['.github/workflows/publish-2.0.0.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish 2.0.0 tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 2.0.0 16e029d567db740dfe843afbd469260d99a7947e -m 'PHP 8.5 / Symfony 7.4 release'
          git push origin 2.0.0
